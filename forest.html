<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>迷雾森林 - 多人合作冒险</title>
    <style>
        :root { --sand: #f4ecdf; --coal: #2f251c; --accent: #c0743a; }
        body { 
            margin: 0; 
            padding: 12px; 
            min-height: 100vh; 
            background: var(--coal); 
            color: var(--sand); 
            font-family: 'Courier New', Courier, sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            box-sizing: border-box;
        }
        
        .header { 
            width: 100%; 
            max-width: 800px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 12px; 
            border-bottom: 1px solid var(--sand); 
            padding-bottom: 10px; 
        }
        .header h2 { margin: 0; font-size: 1.15rem; }
        .back-btn { 
            color: var(--accent); 
            text-decoration: none; 
            font-weight: bold; 
            border: 1px solid var(--accent); 
            padding: 5px 10px; 
            border-radius: 4px; 
            font-size: 0.85rem; 
            background: transparent;
            cursor: pointer;
        }
        
        .dashboard { 
            width: 100%; 
            max-width: 800px; 
            display: flex; 
            justify-content: space-between; 
            flex-wrap: wrap; 
            gap: 8px; 
            background: rgba(244, 236, 223, 0.1); 
            padding: 12px; 
            border-radius: 8px; 
            box-sizing: border-box; 
            font-size: 0.9rem; 
            font-weight: bold; 
        }
        .dashboard span { color: var(--accent); }
        
        .log-screen { 
            width: 100%; 
            max-width: 800px; 
            height: 360px; 
            background: #1a140f; 
            border: 1px solid var(--sand); 
            margin-top: 12px; 
            overflow-y: auto; 
            padding: 12px; 
            box-sizing: border-box; 
            line-height: 1.6; 
            border-radius: 8px; 
            font-size: 0.9rem; 
            scroll-behavior: smooth;
        }
        .log-entry { 
            margin-bottom: 12px; 
            border-left: 3px solid var(--accent); 
            padding-left: 10px; 
            white-space: pre-wrap; 
        }
        .log-sys { color: #888; font-size: 0.85em; }
        .log-important { color: #e5b567; font-weight: bold; }
        
        .controls { 
            width: 100%; 
            max-width: 800px; 
            display: grid; 
            grid-template-columns: 1fr; 
            gap: 10px; 
            margin-top: 12px; 
        }
        button { 
            background: var(--sand); 
            color: var(--coal); 
            border: none; 
            padding: 14px; 
            font-size: 0.95rem; 
            font-weight: bold; 
            cursor: pointer; 
            border-radius: 8px; 
            font-family: inherit; 
            transition: 0.2s;
            user-select: none;
        }
        button:hover:not(:disabled) { background: var(--accent); color: white; }
        button:disabled { background: #443; color: #776; cursor: not-allowed; }

        @media (min-width: 650px) {
            body { padding: 25px; }
            .header h2 { font-size: 1.5rem; }
            .header .back-btn { font-size: 0.95rem; padding: 6px 12px; }
            .dashboard { font-size: 1.1rem; padding: 16px; flex-wrap: nowrap; gap: 0;}
            .log-screen { height: 420px; font-size: 1rem; padding: 16px; margin-top: 18px;}
            .controls { grid-template-columns: repeat(4, 1fr); gap: 12px; margin-top: 18px; }
            button { padding: 16px; font-size: 1rem; }
        }

        #join-modal { 
            position: fixed; 
            inset: 0; 
            background: rgba(0,0,0,0.8); 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            z-index: 1000; 
            padding: 15px;
        }
        .modal-card { 
            background: var(--sand); 
            color: var(--coal); 
            padding: 25px; 
            border-radius: 12px; 
            width: 100%; 
            max-width: 300px; 
            text-align: center; 
            box-sizing: border-box;
        }
        .modal-card input { 
            width: 100%; 
            padding: 12px; 
            margin: 10px 0; 
            border: 1px solid #ccc; 
            border-radius: 4px; 
            box-sizing: border-box; 
            font-size: 16px;
        }
    </style>
</head>
<body>

    <div class="header">
        <h2>🌲 迷雾森林 - 多人合作冒险</h2>
        <a href="games.html" class="back-btn">&laquo; 返回大厅</a>
    </div>

    <div class="dashboard">
        <div>房间ID: <span id="ui-room">未连接</span></div>
        <div>职业: <span id="ui-job">-</span></div>
        <div>队伍血量: <span id="ui-hp">100</span></div>
        <div>进度: <span id="ui-progress">0/30</span></div>
    </div>

    <div class="log-screen" id="logScreen">
        <div class="log-entry log-sys">【系统】欢迎来到迷雾森林联机冒险 v2.0</div>
    </div>

    <div class="controls">
        <button id="btn-start" onclick="sendStart()">🚀 开始探险</button>
        <button id="btn-go" onclick="sendAction('前进探索')" disabled>👣 前进探索</button>
        <button id="btn-hide" onclick="sendAction('躲藏避险')" disabled>🛡️ 躲藏避险</button>
        <button id="btn-fight" onclick="sendAction('战斗对抗')" disabled>⚔️ 战斗对抗</button>
    </div>

    <div id="join-modal">
        <div class="modal-card">
            <h3>🌲 加入/创建探险队</h3>
            <p style="font-size: 12px; color: #555; margin: 5px 0 12px;">输入房间ID加入队伍，留空创建新房间</p>
            <input type="text" id="room-id-input" placeholder="输入房间ID（可选）">
            <button onclick="connectServer()" style="width: 100%; background: var(--coal); color: var(--sand); margin-top: 10px;">进入森林</button>
        </div>
    </div>

    <script>
        let ws = null;
        const logScreen = document.getElementById('logScreen');
        // 将按钮分为两组，方便控制状态
        const btnStart = document.getElementById('btn-start');
        const actionBtns = [
            document.getElementById('btn-go'),
            document.getElementById('btn-hide'),
            document.getElementById('btn-fight')
        ];

        function connectServer() {
            const roomInput = document.getElementById('room-id-input');
            const roomId = roomInput.value.trim() || "new";
            document.getElementById('join-modal').style.display = 'none';
            document.getElementById('ui-room').innerText = roomId;

            // 纯净版 URL，没有 :8443，依靠 Cloudflare 规则转发
            const wsUrl = `wss://gameapi.maxgzh.xyz/ws/forest/${roomId}`;
            
            try {
                ws = new WebSocket(wsUrl);

                ws.onopen = () => {
                    // 🌟 新版核心：连接后必须立刻发送初始化数据
                    const randomId = Math.floor(Math.random() * 9000) + 1000;
                    const roles = ["战士", "法师", "游侠", "医者"];
                    const myRole = roles[Math.floor(Math.random() * roles.length)];
                    
                    ws.send(JSON.stringify({
                        name: `旅人_${randomId}`,
                        role: myRole
                    }));

                    document.getElementById('ui-job').innerText = myRole;
                    addLog("✅ 成功连接服务器！等待队长开始探险...", true);
                    btnStart.disabled = false; // 只有连接成功才允许点击开始
                };

                ws.onmessage = (event) => {
                    try {
                        const data = JSON.parse(event.data);
                        handleServerMsg(data);
                    } catch (e) {
                        console.error("解析消息失败", e);
                    }
                };

                ws.onclose = () => {
                    addLog("❌ 服务器连接断开", true);
                    btnStart.disabled = true;
                    actionBtns.forEach(b => b.disabled = true);
                };

                ws.onerror = () => {
                    addLog("❌ 连接失败，请检查网络", true);
                    document.getElementById('join-modal').style.display = 'flex';
                };
            } catch (err) {
                addLog(`❌ 初始化错误: ${err.message}`, true);
                document.getElementById('join-modal').style.display = 'flex';
            }
        }

        function handleServerMsg(data) {
            switch(data.type) {
                case "player_join":
                case "player_leave":
                case "player_ready":
                    addLog(data.message, true);
                    if (data.hp !== undefined) document.getElementById('ui-hp').innerText = data.hp;
                    if (data.progress !== undefined) document.getElementById('ui-progress').innerText = `${data.progress}/30`;
                    break;
                    
                case "game_start":
                    addLog(data.message, true);
                    addLog(`\n【当前场景】\n${data.current_scene}`, false);
                    btnStart.style.display = 'none'; // 开始游戏后隐藏开始按钮
                    actionBtns.forEach(b => b.disabled = false); // 激活行动按钮
                    break;
                    
                case "status_change":
                    if (data.message) addLog(data.message, true);
                    if (data.status === "ROUND_INPUT") {
                        // 新回合开始，重新激活行动按钮
                        actionBtns.forEach(b => b.disabled = false);
                    } else if (data.status === "AI_PROCESSING") {
                        // AI 处理中，禁用所有按钮防止重复提交
                        actionBtns.forEach(b => b.disabled = true);
                    }
                    break;
                    
                case "round_result":
                    // 🌟 打印 AI 生成的多人联合剧情
                    addLog(`\n📜 【判定结果】\n${data.narration}`, false);
                    addLog(`\n🌫️ 【下一步】\n${data.next_scene}`, false);
                    
                    document.getElementById('ui-hp').innerText = data.hp;
                    document.getElementById('ui-progress').innerText = `${data.progress}/30`;
                    
                    if (data.is_over) {
                        addLog("🏁 探险结束！", true);
                        actionBtns.forEach(b => b.disabled = true);
                    }
                    break;
                    
                case "error":
                    addLog(data.message, true);
                    actionBtns.forEach(b => b.disabled = false); // 出错后允许重新点击
                    break;
            }
        }

        function sendStart() {
            if (!ws) return addLog("❌ 未连接服务器", true);
            ws.send(JSON.stringify({ type: "start_game" }));
            btnStart.disabled = true; // 点一次就灰掉
        }

        function sendAction(action) {
            if (!ws) return addLog("❌ 未连接服务器", true);
            
            addLog(`> 你决定：${action} (等待队友...)`, false);
            ws.send(JSON.stringify({ type: "submit_action", action: action }));
            
            // 点击后立即锁定按钮，等待全队提交完毕
            actionBtns.forEach(b => b.disabled = true);
        }

        function addLog(text, isSys = false) {
            const div = document.createElement('div');
            div.className = isSys ? 'log-entry log-sys' : 'log-entry';
            if(text.includes('【判定结果】') || text.includes('【下一步】')) {
                div.classList.add('log-important');
            }
            div.textContent = text;
            logScreen.appendChild(div);
            logScreen.scrollTop = logScreen.scrollHeight;
        }

        window.onload = () => {
            btnStart.disabled = true;
            actionBtns.forEach(b => b.disabled = true);
        };
    </script>
</body>
</html>
