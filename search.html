<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI 智能体对话</title>
    <style>
        :root { --sand: #f4ecdf; --coal: #2f251c; --accent: #c0743a; }
        body { margin: 0; padding: 0; min-height: 100vh; background: var(--sand); color: var(--coal); font-family: -apple-system, BlinkMacSystemFont, sans-serif; display: flex; flex-direction: column; align-items: center;}
        body::before { content: ""; position: fixed; inset: 0; background: radial-gradient(circle at 12% 10%, #f9efe0 0%, transparent 55%), radial-gradient(circle at 80% 18%, #f4d9b0 0%, transparent 60%), linear-gradient(160deg, #f6efe2 10%, #efe1cb 45%, #f4ecdf 100%); z-index: -2; }
        
        .header { width: 100%; max-width: 900px; padding: 20px; display: flex; align-items: center; justify-content: space-between; box-sizing: border-box; border-bottom: 1px solid rgba(31, 26, 20, 0.1);}
        .back-btn { background: rgba(255,255,255,0.6); padding: 8px 15px; border-radius: 12px; font-weight: bold; color: var(--coal); text-decoration: none; border: 1px solid rgba(255,255,255,0.4); box-shadow: 0 4px 10px rgba(0,0,0,0.02);}
        
        .chat-container { flex: 1; width: 100%; max-width: 900px; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 20px; box-sizing: border-box;}
        
        .message { display: flex; flex-direction: column; max-width: 85%; animation: fadeIn 0.3s ease-out; }
        .msg-user { align-self: flex-end; }
        .msg-ai { align-self: flex-start; }
        
        .msg-bubble { padding: 15px 20px; border-radius: 18px; line-height: 1.6; font-size: 1.05rem; box-shadow: 0 5px 15px rgba(0,0,0,0.04); white-space: pre-wrap;}
        .msg-user .msg-bubble { background: var(--coal); color: white; border-bottom-right-radius: 4px; }
        .msg-ai .msg-bubble { background: rgba(255,255,255,0.85); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.5); border-bottom-left-radius: 4px; }
        
        .msg-label { font-size: 12px; font-weight: bold; margin-bottom: 5px; color: #888; }
        .msg-user .msg-label { text-align: right; }

        .input-area { width: 100%; max-width: 900px; padding: 20px; box-sizing: border-box; background: transparent; }
        .input-box { display: flex; background: rgba(255,255,255,0.9); backdrop-filter: blur(10px); border-radius: 20px; padding: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); border: 1px solid rgba(255,255,255,0.6);}
        .input-box input { flex: 1; border: none; background: transparent; padding: 15px 20px; font-size: 1.05rem; outline: none; }
        .input-box button { background: var(--coal); color: white; border: none; padding: 0 25px; border-radius: 14px; font-weight: bold; cursor: pointer; transition: 0.2s;}
        .input-box button:hover { background: var(--accent); }
        .input-box button:disabled { background: #999; cursor: not-allowed; }

        .loading-dots::after { content: '...'; animation: dots 1.5s steps(4, end) infinite; }
        @keyframes dots { 0%, 20% { color: rgba(0,0,0,0); text-shadow: .25em 0 0 rgba(0,0,0,0), .5em 0 0 rgba(0,0,0,0); } 40% { color: var(--coal); text-shadow: .25em 0 0 rgba(0,0,0,0), .5em 0 0 rgba(0,0,0,0); } 60% { text-shadow: .25em 0 0 var(--coal), .5em 0 0 rgba(0,0,0,0); } 80%, 100% { text-shadow: .25em 0 0 var(--coal), .5em 0 0 var(--coal); } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div class="header">
        <div style="font-size: 1.2rem; font-weight: bold;">✨ AI 智能搜索</div>
        <a href="index.html" class="back-btn">&laquo; 返回中转站</a>
    </div>

    <div class="chat-container" id="chatBox">
        </div>

    <div class="input-area">
        <div class="input-box">
            <input type="text" id="chatInput" placeholder="继续追问或搜索新内容..." onkeypress="handleEnter(event)">
            <button id="sendBtn" onclick="sendMessage()">发送</button>
        </div>
    </div>

    <script>
        const chatBox = document.getElementById('chatBox');
        const chatInput = document.getElementById('chatInput');
        const sendBtn = document.getElementById('sendBtn');
        let chatHistory = []; // 保存上下文记忆

        // 初始化：解析 URL 里的搜索词并自动发送
        window.onload = function() {
            const params = new URLSearchParams(window.location.search);
            const initialQuery = params.get('q');
            if (initialQuery) {
                chatInput.value = initialQuery;
                sendMessage();
            } else {
                appendMessage('ai', '你好！我是能量中转站的专属 AI。你可以向我搜索知识、提出问题或要求我进行创作。');
            }
        };

        function handleEnter(e) {
            if (e.key === 'Enter') sendMessage();
        }

        function appendMessage(role, text, isLoading = false) {
            const div = document.createElement('div');
            div.className = `message msg-${role}`;
            
            const label = document.createElement('div');
            label.className = 'msg-label';
            label.innerText = role === 'user' ? '访客' : 'DeepSeek 智能体';
            
            const bubble = document.createElement('div');
            bubble.className = 'msg-bubble';
            if (isLoading) {
                bubble.classList.add('loading-dots');
                bubble.innerText = '正在思考中';
            } else {
                bubble.innerText = text;
            }

            div.appendChild(label);
            div.appendChild(bubble);
            chatBox.appendChild(div);
            
            chatBox.scrollTop = chatBox.scrollHeight;
            return bubble; // 返回元素方便后续修改（用于替换 loading 动画）
        }

        async function sendMessage() {
            const text = chatInput.value.trim();
            if (!text) return;
            
            // 锁定输入
            chatInput.value = '';
            chatInput.disabled = true;
            sendBtn.disabled = true;

            // 1. 屏幕显示用户的话
            appendMessage('user', text);
            
            // 2. 将用户的话推入历史记录数组
            chatHistory.push({ role: "user", content: text });

            // 3. 屏幕显示 AI 加载中
            const loadingBubble = appendMessage('ai', '', true);

            try {
                // 呼叫 Cloudflare 后端接口，不暴露你的 API Key
                const response = await fetch('/api/search-ai', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ messages: chatHistory })
                });
                
                const data = await response.json();
                
                // 去除加载动画，填入真实回复
                loadingBubble.classList.remove('loading-dots');
                
                if (data.reply) {
                    loadingBubble.innerText = data.reply;
                    chatHistory.push({ role: "assistant", content: data.reply }); // 保存 AI 记忆
                } else {
                    loadingBubble.innerText = "抱歉，神经计算中枢未返回数据。";
                }

            } catch (err) {
                loadingBubble.classList.remove('loading-dots');
                loadingBubble.innerText = "❌ 连接边缘节点失败，请检查网络。";
            }

            // 解锁输入
            chatInput.disabled = false;
            sendBtn.disabled = false;
            chatInput.focus();
        }
    </script>
</body>
</html>
