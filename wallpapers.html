<!DOCTYPE html>
<html>
<head>
    <title>壁纸画廊 - maxgzh</title>
    <meta charset="utf-8">
    <style>
        body { font-family: sans-serif; background: #f4f7f6; margin: 0; padding: 20px; }
        h1 { text-align: center; color: #333; }
        .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; padding: 20px; }
        .card { background: white; border-radius: 15px; overflow: hidden; box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
        .card img { width: 100%; height: 200px; object-fit: cover; }
        .info { padding: 15px; text-align: center; }
        .date { color: #888; font-size: 14px; }
        .btn-back { display: block; width: 100px; margin: 20px auto; padding: 10px; text-align: center; background: #333; color: white; border-radius: 5px; text-decoration: none; }
    </style>
</head>
<body>
    <h1>全自动采集壁纸库</h1>
    <a href="index.html" class="btn-back">返回首页</a>
    <div class="gallery" id="gallery-container">
        </div>

    <script>
        fetch('/api/get-wallpapers')
            .then(res => res.json())
            .then(data => {
                const container = document.getElementById('gallery-container');
                data.forEach(item => {
                    container.innerHTML += `
                        <div class="card">
                            <img src="${item.img_url}">
                            <div class="info">
                                <div class="date">${item.img_date}</div>
                                <button onclick="window.open('${item.img_url}')" style="margin-top:10px; padding:5px 10px; cursor:pointer;">查看原图</button>
                            </div>
                        </div>
                    `;
                });
            });
    </script>
</body>
</html>
