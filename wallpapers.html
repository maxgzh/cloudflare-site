<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>能量中转站 - 壁纸收藏库</title>
    <style>
        :root { --sand: #f4ecdf; --coal: #2f251c; --soft-line: rgba(31, 26, 20, 0.15); }
        body { margin: 0; padding: 30px 20px; min-height: 100vh; background: var(--sand); font-family: -apple-system, BlinkMacSystemFont, sans-serif; color: var(--coal); }
        
        body::before { content: ""; position: fixed; inset: 0; background: radial-gradient(circle at 12% 10%, #f9efe0 0%, transparent 55%), radial-gradient(circle at 80% 18%, #f4d9b0 0%, transparent 60%), linear-gradient(160deg, #f6efe2 10%, #efe1cb 45%, #f4ecdf 100%); z-index: -2; }
        
        .header { max-width: 1200px; margin: 0 auto 30px; display: flex; justify-content: space-between; align-items: center; }
        .header h1 { margin: 0; font-size: 1.8rem; color: var(--coal); }
        .back-btn { text-decoration: none; color: var(--coal); font-weight: bold; padding: 8px 16px; background: rgba(255,255,255,0.5); border-radius: 8px; border: 1px solid var(--soft-line); transition: 0.3s; }
        .back-btn:hover { background: var(--coal); color: white; }

        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; max-width: 1200px; margin: 0 auto; }
        .gallery-item { background: rgba(255,255,255,0.6); border-radius: 16px; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.03); border: 1px solid var(--soft-line); transition: transform 0.3s; cursor: pointer; }
        .gallery-item:hover { transform: translateY(-5px); box-shadow: 0 15px 30px rgba(0,0,0,0.08); }
        .gallery-item img { width: 100%; height: 180px; object-fit: cover; display: block; background: #eee; }
        .gallery-info { padding: 12px; font-size: 13px; font-weight: bold; text-align: center; background: rgba(255,255,255,0.4); border-top: 1px solid var(--soft-line); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        #lightbox { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: none; justify-content: center; align-items: center; z-index: 9999; }
        #lightbox img { max-width: 90%; max-height: 85vh; border-radius: 12px; box-shadow: 0 10px 40px rgba(0,0,0,0.5); }
        .close-btn { position: absolute; top: 20px; right: 30px; color: white; font-size: 35px; cursor: pointer; font-weight: bold; }
        
        #loading { text-align: center; font-size: 1.1rem; margin-top: 100px; font-weight: bold; color: #666; }
    </style>
</head>
<body>

    <div class="header">
        <h1>🌌 壁纸收藏库</h1>
        <a href="index.html" class="back-btn">&laquo; 返回主页</a>
    </div>

    <div id="loading">正在从云端数据库拉取壁纸库...</div>
    <div id="galleryGrid" class="gallery-grid"></div>

    <div id="lightbox" onclick="this.style.display='none'">
        <span class="close-btn">&times;</span>
        <img id="lightbox-img" src="">
    </div>

    <script>
        window.onload = function() {
            const grid = document.getElementById('galleryGrid');
            const loading = document.getElementById('loading');

            fetch('/api/get-public-wallpapers')
                .then(res => res.json())
                .then(rawData => {
                    loading.style.display = 'none';
                    console.log("后端返回的原始数据:", rawData);

                    // 🌟 1. 自动拆包：兼容直接返回数组，或者包裹在 results、data 里的情况
                    let list = [];
                    if (Array.isArray(rawData)) {
                        list = rawData;
                    } else if (rawData && Array.isArray(rawData.results)) {
                        list = rawData.results;
                    } else if (rawData && Array.isArray(rawData.data)) {
                        list = rawData.data;
                    }

                    if (!list || list.length === 0) {
                        grid.innerHTML = `<p style="grid-column: 1/-1; text-align:center; color:#888; font-weight:bold;">暂无壁纸数据 (解析到空列表)</p>`;
                        return;
                    }

                    // 2. 开始渲染
                    list.forEach(item => {
                        // 🌟 2. 字段名终极兼容：不管大小写还是带不带下划线，全部通杀
                        const imgUrl = item.img_url || item.imgUrl || item.url || item.URL || ''; 
                        const imgName = item.img_name || item.imgName || item.title || item.name || '每日精选';

                        if (imgUrl) {
                            grid.innerHTML += `
                                <div class="gallery-item" onclick="openLightbox('${imgUrl}')">
                                    <img src="${imgUrl}" alt="壁纸" loading="lazy">
                                    <div class="gallery-info">${imgName}</div>
                                </div>
                            `;
                        }
                    });
                })
                .catch(err => {
                    console.error("加载壁纸库失败:", err);
                    loading.innerText = "❌ 无法连接到壁纸数据库，请检查后端文件。";
                });
        };

        function openLightbox(url) {
            document.getElementById('lightbox-img').src = url;
            document.getElementById('lightbox').style.display = 'flex';
        }
    </script>
</body>
</html>
