<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>赛博小店 - AI经营模拟</title>
    <style>
        :root { --sand: #f4ecdf; --coal: #2f251c; --accent: #c0743a; }
        body { margin: 0; padding: 12px; min-height: 100vh; background: var(--coal); color: var(--sand); font-family: 'Courier New', Courier, sans-serif; display: flex; flex-direction: column; align-items: center; box-sizing: border-box;}
        
        .header { width: 100%; max-width: 800px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; border-bottom: 1px solid var(--sand); padding-bottom: 10px; }
        .header h2 { margin: 0; font-size: 1.15rem; }
        .back-btn { color: var(--accent); text-decoration: none; font-weight: bold; border: 1px solid var(--accent); padding: 5px 10px; border-radius: 4px; font-size: 0.85rem; background: transparent;}
        
        /* 手机端自适应面板 */
        .dashboard { width: 100%; max-width: 800px; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; background: rgba(244, 236, 223, 0.1); padding: 12px; border-radius: 8px; box-sizing: border-box; font-size: 0.9rem; font-weight: bold; }
        .dashboard span { color: var(--accent); }
        
        .log-screen { width: 100%; max-width: 800px; height: 360px; background: #1a140f; border: 1px solid var(--sand); margin-top: 12px; overflow-y: auto; padding: 12px; box-sizing: border-box; line-height: 1.6; border-radius: 8px; font-size: 0.9rem; scroll-behavior: smooth;}
        .log-entry { margin-bottom: 12px; border-left: 3px solid var(--accent); padding-left: 10px; white-space: pre-wrap; }
        .log-sys { color: #888; font-size: 0.85em; }
        
        /* 📱 手机端默认全宽大按钮竖排堆叠 */
        .controls { width: 100%; max-width: 800px; display: grid; grid-template-columns: 1fr; gap: 10px; margin-top: 12px; }
        button { background: var(--sand); color: var(--coal); border: none; padding: 14px; font-size: 0.95rem; font-weight: bold; cursor: pointer; border-radius: 8px; font-family: inherit; transition: 0.2s;}
        button:hover, button:active { background: var(--accent); color: white; }
        button:disabled { background: #555; color: #888; cursor: not-allowed; }
        
        #auth-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: center; z-index: 1000; padding: 15px;}
        .modal-card { background: var(--sand); color: var(--coal); padding: 25px; border-radius: 12px; width: 100%; max-width: 300px; text-align: center; box-sizing: border-box;}
        .modal-card input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 16px;}

        /* 💻 电脑大屏自适应方案 */
        @media (min-width: 650px) {
            body { padding: 25px; }
            .header h2 { font-size: 1.5rem; }
            .header .back-btn { font-size: 0.95rem; padding: 6px 12px; }
            .dashboard { font-size: 1.1rem; padding: 16px; flex-wrap: nowrap; gap: 0;}
            .log-screen { height: 420px; font-size: 1rem; padding: 16px; margin-top: 18px;}
            .controls { grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 18px;}
            button { padding: 16px; font-size: 1rem; }
        }
    </style>
</head>
<body>

    <div class="header">
        <h2>🏪 赛博小店系统 v1.0</h2>
        <div style="display: flex; gap: 8px;">
            <button class="back-btn" onclick="openSaveModal()" style="background:var(--accent); color:var(--sand);">💾 存档同步</button>
            <a href="games.html" class="back-btn">&laquo; 大厅</a>
        </div>
    </div>

    <div class="dashboard">
        <div>天数: 第 <span id="ui-day">1</span> 天</div>
        <div>资金: $<span id="ui-money">1000</span></div>
        <div>库存: <span id="ui-inv">0</span> 件</div>
        <div>名声: <span id="ui-rep">10</span></div>
    </div>

    <div class="log-screen" id="logScreen">
        <div class="log-entry">【系统】欢迎来到赛博黑市。你的小店正式营业，DeepSeek 商业神经元正在实时演算所有因果走向...</div>
    </div>

    <div class="controls">
        <button id="btn-buy" onclick="doAction('花钱进货，不管质量如何')">📦 黑市进货 (消耗资金)</button>
        <button id="btn-sell" onclick="doAction('疯狂推销库存商品')">💰 疯狂推销 (出清库存)</button>
        <button id="btn-rand" onclick="doAction('在店门口举办奇怪的营销活动')">🎪 搞事营销 (突发概率)</button>
    </div>

    <div id="auth-modal">
        <div class="modal-card">
            <h3>云端神经链路上传</h3>
            <p style="font-size: 12px; color: #555; margin: 5px 0 12px;">输入中转站账号。<br>若账号不存在，系统将自动注册。</p>
            <input type="text" id="auth-user" placeholder="输入账号">
            <input type="password" id="auth-pwd" placeholder="输入密码">
            <button onclick="saveGame()" style="width: 100%; background: var(--coal); color: var(--sand); margin-top: 10px;">执行上传</button>
            <button onclick="document.getElementById('auth-modal').style.display='none'" style="width: 100%; margin-top: 10px; background: transparent; border: 1px solid var(--coal);">取消</button>
        </div>
    </div>

    <script>
        let state = { day: 1, money: 1000, inventory: 0, reputation: 10 };
        const logScreen = document.getElementById('logScreen');
        const btns = document.querySelectorAll('.controls button');

        window.onload = async function() {
            const savedUser = localStorage.getItem('currentUser');
            if (savedUser) {
                document.getElementById('auth-user').value = savedUser;
                addLog(`检测到中转站登录痕迹：[${savedUser}]，已为你准备就绪。`, true);
                
                const res = await fetch('/api/game-load', { method: 'POST', body: JSON.stringify({username: savedUser}) });
                const data = await res.json();
                if (data.success) {
                    state = data.state;
                    updateUI();
                    addLog(`【系统】成功从云端网络抓取存档，欢迎回来：${savedUser}。`, true);
                }
            }
            updateUI();
        };

        function updateUI() {
            document.getElementById('ui-day').innerText = state.day;
            document.getElementById('ui-money').innerText = state.money;
            document.getElementById('ui-inv').innerText = state.inventory;
            document.getElementById('ui-rep').innerText = state.reputation;
        }

        function addLog(text, isSys = false) {
            const div = document.createElement('div');
            div.className = isSys ? 'log-entry log-sys' : 'log-entry';
            div.innerText = text;
            logScreen.appendChild(div);
            logScreen.scrollTop = logScreen.scrollHeight; 
        }

        // 🌟 核心引擎：呼叫 DeepSeek AI 算账并组装优雅的中文结算反馈
        async function doAction(actionName) {
            btns.forEach(b => b.disabled = true);
            addLog(`> 玩家行动：${actionName}`);
            addLog(`⌛ AI 正在演算因果律...`, true);

            try {
                const res = await fetch('/api/game-ai', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ state, action: actionName })
                });
                const data = await res.json();
                
                let reply = data.reply;
                let cleanReply = reply;

                // 提取数值，隐式计算
                const match = reply.match(/\[MONEY:([+-]?\d+),\s*INV:([+-]?\d+),\s*REP:([+-]?\d+)\]/i);
                if (match) {
                    const m_change = parseInt(match[1]);
                    const i_change = parseInt(match[2]);
                    const r_change = parseInt(match[3]);

                    state.money += m_change;
                    state.inventory += i_change;
                    state.reputation += r_change;
                    if(state.money < 0) state.money = 0;
                    if(state.inventory < 0) state.inventory = 0;

                    // 翻译：在这里将难看的英文转义为高颜值的中文结算通知单
                    const feedbackText = `\n\n📊 【行动结算】 资金 ${m_change >= 0 ? '+'+m_change : m_change} | 库存 ${i_change >= 0 ? '+'+i_change : i_change} | 名声 ${r_change >= 0 ? '+'+r_change : r_change}`;
                    
                    // 用中文面板平滑替换掉原始的底层指令文本
                    cleanReply = reply.replace(/\[MONEY:[^\]]+\]/i, feedbackText).trim();
                }
                
                addLog(cleanReply);
                state.day += 1;
                updateUI();

            } catch (err) {
                addLog("❌ 神经链路断开，行动演算法失败。", true);
            }
            btns.forEach(b => b.disabled = false);
        }

        function openSaveModal() {
            document.getElementById('auth-modal').style.display = 'flex';
        }

        async function saveGame() {
            const user = document.getElementById('auth-user').value;
            const pwd = document.getElementById('auth-pwd').value;
            if(!user || !pwd) return alert('账号密码不能为空');

            addLog(`⌛ 正在打包记忆上传至云端...`, true);
            document.getElementById('auth-modal').style.display = 'none';

            const res = await fetch('/api/game-save', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: user, password: pwd, state: state })
            });
            const data = await res.json();

            if(data.success) {
                addLog(`✅ 进度同步成功！已将记忆安全锁死在 [${user}] 密钥下。`, true);
                localStorage.setItem('currentUser', user); 
            } else {
                addLog(`❌ 同步失败：${data.error}`, true);
            }
        }
    </script>
</body>
</html>
