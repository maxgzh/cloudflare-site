<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>我的私有云盘 - 登录</title>
    <style>
        :root { 
            --primary: #3f6f6b; /* 专业、安全的深青色 */
            --primary-hover: #2c504d;
            --bg-color: #f0f4f8; /* 干净的浅蓝灰背景 */
            --text-main: #2d3748;
            --text-light: #718096;
            --white: #ffffff;
        }
        body { margin: 0; padding: 0; min-height: 100vh; display: flex; justify-content: center; align-items: center; background: var(--bg-color); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; overflow: hidden;}
        
        /* 增加动态云层背景装饰，突出云盘主题 */
        body::before { content: ""; position: absolute; top: -10%; left: -10%; width: 400px; height: 400px; background: radial-gradient(circle, rgba(63, 111, 107, 0.1) 0%, transparent 70%); z-index: -1; }
        body::after { content: ""; position: absolute; bottom: -10%; right: -10%; width: 500px; height: 500px; background: radial-gradient(circle, rgba(192, 116, 58, 0.08) 0%, transparent 70%); z-index: -1; }

        .auth-wrapper { display: flex; background: var(--white); border-radius: 20px; box-shadow: 0 20px 40px rgba(0,0,0,0.08); overflow: hidden; max-width: 800px; width: 90%; z-index: 10;}
        
        /* 左侧产品介绍区 */
        .branding-side { background: linear-gradient(135deg, var(--primary), #2a4a47); color: var(--white); padding: 50px 40px; flex: 1; display: flex; flex-direction: column; justify-content: center;}
        .branding-side h1 { margin: 0 0 15px 0; font-size: 28px; letter-spacing: 1px;}
        .branding-side p { margin: 0 0 30px 0; font-size: 15px; line-height: 1.6; opacity: 0.9;}
        .feature-list { list-style: none; padding: 0; margin: 0; }
        .feature-list li { display: flex; align-items: center; margin-bottom: 15px; font-size: 14px; opacity: 0.95;}
        .feature-list li span { display: inline-block; width: 24px; height: 24px; background: rgba(255,255,255,0.2); border-radius: 50%; text-align: center; line-height: 24px; margin-right: 12px; font-size: 12px;}

        /* 右侧登录区 */
        .form-side { padding: 50px 40px; flex: 1; background: var(--white); min-width: 300px; }
        .tabs { display: flex; margin-bottom: 30px; border-bottom: 2px solid #edf2f7; }
        .tab { flex: 1; text-align: center; padding: 12px; cursor: pointer; font-weight: bold; color: var(--text-light); transition: all 0.3s; }
        .tab.active { color: var(--primary); border-bottom: 2px solid var(--primary); margin-bottom: -2px; }
        .tab:hover:not(.active) { color: var(--text-main); }
        
        .input-group { margin-bottom: 20px; }
        .input-group label { display: block; font-size: 13px; margin-bottom: 8px; color: var(--text-main); font-weight: bold;}
        .input-group input { width: 100%; padding: 14px; border: 1px solid #e2e8f0; border-radius: 8px; box-sizing: border-box; background: #f8fafc; outline: none; font-size: 14px; transition: border-color 0.3s;}
        .input-group input:focus { border-color: var(--primary); background: var(--white); box-shadow: 0 0 0 3px rgba(63, 111, 107, 0.1); }
        
        .btn { width: 100%; padding: 14px; border: none; border-radius: 8px; background: var(--primary); color: white; font-size: 15px; font-weight: bold; cursor: pointer; transition: 0.3s; margin-top: 10px; }
        .btn:hover { background: var(--primary-hover); transform: translateY(-1px); box-shadow: 0 4px 12px rgba(63, 111, 107, 0.2); }
        
        #msg { margin-top: 20px; font-size: 13px; text-align: center; color: #e53e3e; font-weight: bold; min-height: 20px;}

        /* 移动端适配 */
        @media (max-width: 768px) {
            .auth-wrapper { flex-direction: column; }
            .branding-side { padding: 30px; }
            .form-side { padding: 30px; }
        }
    </style>
</head>
<body>

    <div class="auth-wrapper">
        <div class="branding-side">
            <h1>我的私有云盘</h1>
            <p>基于 Cloudflare 架构构建的个人级云端存储中心，为您提供极速、安全、私密的文件管理体验。</p>
            <ul class="feature-list">
                <li><span>🔒</span> 独立空间，数据绝对私有</li>
                <li><span>⚡</span> 专线网络，大文件极速传输</li>
                <li><span>🖼️</span> 画廊模式，沉浸式壁纸预览</li>
                <li><span>📁</span> 层级目录，文件管理井井有条</li>
            </ul>
        </div>

        <div class="form-side">
            <div class="tabs">
                <div class="tab active" id="tabLogin" onclick="switchTab('login')">账号登录</div>
                <div class="tab" id="tabRegister" onclick="switchTab('register')">新用户注册</div>
            </div>

            <div id="loginForm">
                <div class="input-group">
                    <label>管理账号</label>
                    <input type="text" id="loginUser" placeholder="请输入您的云盘账号">
                </div>
                <div class="input-group">
                    <label>访问密码</label>
                    <input type="password" id="loginPwd" placeholder="请输入密码">
                </div>
                <button class="btn" onclick="doLogin()">进入云盘</button>
            </div>

            <div id="registerForm" style="display: none;">
                <div class="input-group">
                    <label>设置云盘账号</label>
                    <input type="text" id="regUser" placeholder="创建您的专属账号">
                </div>
                <div class="input-group">
                    <label>设置安全密码</label>
                    <input type="password" id="regPwd" placeholder="至少输入 6 位密码">
                </div>
                <button class="btn" onclick="doRegister()" style="background: #2d3748;">创建专属云盘</button>
            </div>
            <div id="msg"></div>
        </div>
    </div>

    <script>
        function switchTab(type) {
            document.getElementById('msg').innerText = '';
            if(type === 'login') {
                document.getElementById('tabLogin').classList.add('active'); document.getElementById('tabRegister').classList.remove('active');
                document.getElementById('loginForm').style.display = 'block'; document.getElementById('registerForm').style.display = 'none';
            } else {
                document.getElementById('tabRegister').classList.add('active'); document.getElementById('tabLogin').classList.remove('active');
                document.getElementById('registerForm').style.display = 'block'; document.getElementById('loginForm').style.display = 'none';
            }
        }

        async function doRegister() {
            const username = document.getElementById('regUser').value.trim();
            const password = document.getElementById('regPwd').value.trim();
            const msg = document.getElementById('msg');
            msg.style.color = '#e53e3e';
            
            if(!username || !password) {
                msg.innerText = '账号和密码不能为空！';
                return;
            }

            msg.style.color = '#718096';
            msg.innerText = '正在分配云端空间...';

            try {
                const res = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();
                if (res.ok) {
                    msg.style.color = '#38a169'; // 成功绿
                    msg.innerText = '🎉 空间创建成功！即将跳转登录...';
                    document.getElementById('regUser').value = ''; document.getElementById('regPwd').value = '';
                    setTimeout(() => { switchTab('login'); }, 1500);
                } else {
                    msg.style.color = '#e53e3e';
                    msg.innerText = data.error || '注册失败';
                }
            } catch (err) {
                msg.style.color = '#e53e3e';
                msg.innerText = '网络连接异常，请重试。';
            }
        }

        async function doLogin() {
            const username = document.getElementById('loginUser').value.trim();
            const password = document.getElementById('loginPwd').value.trim();
            const msg = document.getElementById('msg');
            msg.style.color = '#e53e3e';
            
            if(!username || !password) {
                msg.innerText = '账号和密码不能为空！';
                return;
            }

            msg.style.color = '#718096';
            msg.innerText = '正在验证安全凭证...';

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();
                if (res.ok) {
                    msg.style.color = '#38a169'; 
                    msg.innerText = '验证通过！正在开启您的私有云盘...';
                    localStorage.setItem('currentUser', username);
                    setTimeout(() => { window.location.href = 'dashboard.html'; }, 800);
                } else {
                    msg.style.color = '#e53e3e';
                    msg.innerText = data.error || '账号或密码错误';
                }
            } catch (err) {
                msg.style.color = '#e53e3e';
                msg.innerText = '网络连接异常，请重试。';
            }
        }
    </script>
</body>
</html>
