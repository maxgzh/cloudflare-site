<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>能量中转站 - 登录</title>
    <style>
        :root { --sand: #f4ecdf; --coal: #2f251c; --soft-line: rgba(31, 26, 20, 0.15); }
        body { margin: 0; padding: 0; min-height: 100vh; display: flex; justify-content: center; align-items: center; background: var(--sand); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; overflow: hidden;}
        body::before { content: ""; position: fixed; inset: 0; background: radial-gradient(circle at 12% 10%, #f9efe0 0%, transparent 55%), radial-gradient(circle at 80% 18%, #f4d9b0 0%, transparent 60%), radial-gradient(circle at 70% 82%, #e9efe9 0%, transparent 55%), linear-gradient(160deg, #f6efe2 10%, #efe1cb 45%, #f4ecdf 100%); z-index: -2; }
        body::after { content: ""; position: fixed; inset: 0; background-image: repeating-linear-gradient(100deg, rgba(31, 26, 20, 0.04), rgba(31, 26, 20, 0.04) 1px, transparent 1px, transparent 12px), repeating-linear-gradient(10deg, rgba(31, 26, 20, 0.03), rgba(31, 26, 20, 0.03) 1px, transparent 1px, transparent 10px); opacity: 0.55; z-index: -1; pointer-events: none; }
        
        /* 🌟 中心布局容器，用于垂直排列时钟和登录框 */
        .center-wrapper { display: flex; flex-direction: column; align-items: center; gap: 30px; z-index: 10; width: 100%; max-width: 360px; }

        /* 🌟 独立悬浮时钟 UI */
        .clock-widget { text-align: center; color: var(--coal); font-variant-numeric: tabular-nums; text-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .clock-time { font-size: 3rem; font-weight: 800; letter-spacing: 2px; line-height: 1; margin-bottom: 8px; }
        .clock-date { font-size: 1rem; font-weight: 600; opacity: 0.85; letter-spacing: 1px; }

        /* 核心登录卡片 */
        .auth-card { background: rgba(255, 255, 255, 0.85); padding: 40px; border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.05); border: 1px solid var(--soft-line); width: 100%; box-sizing: border-box; backdrop-filter: blur(10px); }
        
        .tabs { display: flex; margin-bottom: 24px; border-bottom: 2px solid var(--soft-line); }
        .tab { flex: 1; text-align: center; padding: 10px; cursor: pointer; font-weight: bold; color: #888; }
        .tab.active { color: var(--coal); border-bottom: 2px solid var(--coal); margin-bottom: -2px; }
        .input-group { margin-bottom: 16px; }
        .input-group label { display: block; font-size: 0.9rem; margin-bottom: 6px; color: var(--coal); font-weight: bold;}
        .input-group input { width: 100%; padding: 12px; border: 1px solid var(--soft-line); border-radius: 8px; box-sizing: border-box; background: rgba(255,255,255,0.9); outline: none;}
        .btn { width: 100%; padding: 14px; border: none; border-radius: 8px; background: var(--coal); color: white; font-size: 1rem; font-weight: bold; cursor: pointer; transition: 0.3s; margin-top: 10px; }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(47,37,28,0.2);}
        #msg { margin-top: 15px; font-size: 0.9rem; text-align: center; color: #c0743a; font-weight: bold; min-height: 20px;}

        /* 左上角天气组件 */
        .weather-box { position: absolute; top: 25px; left: 25px; background: rgba(255, 255, 255, 0.45); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); padding: 12px 20px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.04); border: 1px solid rgba(255,255,255,0.5); display: flex; align-items: center; gap: 15px; z-index: 10; font-size: 14px; }
        .weather-city { font-weight: bold; color: #c0743a; font-size: 15px;}
        .weather-temp { font-size: 20px; font-weight: bold; color: #2f251c; }

        /* 右下角壁纸卡片 */
        #wallpaper-widget { position: fixed; bottom: 25px; right: 25px; width: 220px; background: rgba(255,255,255,0.85); padding: 12px; border-radius: 16px; box-shadow: 0 8px 25px rgba(0,0,0,0.08); backdrop-filter: blur(8px); text-align: center; font-size: 13px; border: 1px solid #eee; transition: transform 0.3s ease; z-index: 10; }
        #wallpaper-widget:hover { transform: translateY(-5px) scale(1.02); }
        #today-img { width: 100%; height: 130px; object-fit: cover; border-radius: 10px; cursor: pointer; transition: 0.3s; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
    </style>
</head>
<body>

    <div class="weather-box" id="weatherBox">
        <div style="font-size: 26px;" id="weatherIcon">🌍</div>
        <div>
            <div id="weatherLocation" class="weather-city">定位中...</div>
            <div style="font-size: 12px; color: #666; margin-top: 2px;" id="weatherDetail">正在同步天气</div>
        </div>
        <div id="weatherTemp" class="weather-temp">--°C</div>
    </div>

    <div class="center-wrapper">
        
        <div class="clock-widget">
            <div class="clock-time" id="clock-time">00:00:00</div>
            <div class="clock-date" id="clock-date">读取中...</div>
        </div>

        <div class="auth-card">
            <div class="tabs">
                <div class="tab active" id="tabLogin" onclick="switchTab('login')">登录</div>
                <div class="tab" id="tabRegister" onclick="switchTab('register')">注册账号</div>
            </div>

            <div id="loginForm">
                <div class="input-group"><label>账号</label><input type="text" id="loginUser" placeholder="输入账号"></div>
                <div class="input-group"><label>密码</label><input type="password" id="loginPwd" placeholder="输入密码"></div>
                <button class="btn" onclick="doLogin()">安全登录</button>
            </div>

            <div id="registerForm" style="display: none;">
                <div class="input-group"><label>设置账号</label><input type="text" id="regUser" placeholder="起个名字"></div>
                <div class="input-group"><label>设置密码</label><input type="password" id="regPwd" placeholder="设置密码"></div>
                <button class="btn" onclick="doRegister()" style="background: #c0743a;">提交到云数据库</button>
            </div>
            <div id="msg"></div>
        </div>
    </div>

    <div id="wallpaper-widget">
        <p style="margin: 0 0 8px 0; color: #555; font-weight: bold;">今日必应壁纸</p>
        <img id="today-img" src="" onclick="window.open(this.src)">
        <a href="wallpapers.html" style="display: block; margin-top: 10px; color: #007bff; text-decoration: none; font-weight: bold;">查看更多壁纸 &raquo;</a>
    </div>

    <script>
        // 🌟 独立时钟跳动逻辑
        function startClock() {
            const timeEl = document.getElementById('clock-time');
            const dateEl = document.getElementById('clock-date');
            const weekdays = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
            
            function update() {
                const now = new Date();
                const y = now.getFullYear();
                const m = String(now.getMonth() + 1).padStart(2, '0');
                const d = String(now.getDate()).padStart(2, '0');
                const h = String(now.getHours()).padStart(2, '0');
                const min = String(now.getMinutes()).padStart(2, '0');
                const s = String(now.getSeconds()).padStart(2, '0');
                const w = weekdays[now.getDay()];
                
                timeEl.innerText = `${h}:${min}:${s}`;
                dateEl.innerText = `${y}年${m}月${d}日 ${w}`;
            }
            update();
            setInterval(update, 1000); 
        }

        // 获取后端天气
        async function initWeather() {
            try {
                const res = await fetch('/api/weather');
                const data = await res.json();
                
                if (data.success) {
                    document.getElementById('weatherIcon').innerText = data.icon;
                    document.getElementById('weatherLocation').innerText = data.city;
                    document.getElementById('weatherDetail').innerText = data.desc;
                    document.getElementById('weatherTemp').innerText = `${data.temp}°C`;
                } else {
                    throw new Error("后端数据异常");
                }
            } catch (error) {
                console.warn("天气加载失败:", error);
                document.getElementById('weatherIcon').innerText = "☁️";
                document.getElementById('weatherLocation').innerText = "地球";
                document.getElementById('weatherDetail').innerText = "无信号";
                document.getElementById('weatherTemp').innerText = "--°C";
            }
        }

        // 页面初始化
        window.onload = function() {
            startClock();  
            initWeather(); 
            
            // 呼叫独立公共壁纸接口
            fetch('/api/get-public-wallpapers?type=latest')
                .then(res => res.json())
                .then(data => {
                    if (data && data.img_url) {
                        document.getElementById('today-img').src = data.img_url;
                    } else {
                        document.getElementById('today-img').src = "https://bing.biturl.top/?resolution=1920&format=image&index=0&mkt=zh-CN";
                    }
                }).catch(() => {
                    document.getElementById('today-img').src = "https://bing.biturl.top/?resolution=1920&format=image&index=0&mkt=zh-CN";
                });
        };

        // 选项卡切换
        function switchTab(type) {
            document.getElementById('msg').innerText = '';
            if(type === 'login') {
                document.getElementById('tabLogin').classList.add('active'); document.getElementById('tabRegister').classList.remove('active');
                document.getElementById('loginForm').style.display = 'block'; document.getElementById('registerForm').style.display = 'none';
            } else {
                document.getElementById('tabRegister').classList.add('active'); document.getElementById('tabLogin').classList.remove('active');
                document.getElementById('registerForm').style.display = 'block'; document.getElementById('loginForm').style.display = 'none';
            }
        }

        // 注册
        async function doRegister() {
            const username = document.getElementById('regUser').value;
            const password = document.getElementById('regPwd').value;
            const msg = document.getElementById('msg');
            msg.style.color = '#c0743a';
            
            if(!username || !password) return msg.innerText = '账号和密码不能为空！';

            const res = await fetch('/api/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });
            const data = await res.json();
            if (res.ok) {
                msg.style.color = '#3f6f6b';
                msg.innerText = '注册成功！已实时写入云端数据库。';
                document.getElementById('regUser').value = ''; document.getElementById('regPwd').value = '';
                setTimeout(() => { switchTab('login'); }, 1500);
            } else {
                msg.innerText = data.error || '注册失败';
            }
        }

        // 登录
        async function doLogin() {
            const username = document.getElementById('loginUser').value;
            const password = document.getElementById('loginPwd').value;
            const msg = document.getElementById('msg');
            msg.style.color = '#c0743a';
            
            if(!username || !password) return msg.innerText = '账号和密码不能为空！';

            const res = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });
            const data = await res.json();
            if (res.ok) {
                msg.style.color = '#3f6f6b'; msg.innerText = '验证通过！正在进入控制台...';
                localStorage.setItem('currentUser', username);
                setTimeout(() => { window.location.href = 'dashboard.html'; }, 800);
            } else {
                msg.innerText = data.error || '登录失败';
            }
        }
    </script>
</body>
</html>
