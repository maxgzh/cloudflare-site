<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>能量中转站 - AI 搜索中心</title>
    <style>
        :root { --sand: #f4ecdf; --coal: #2f251c; --soft-line: rgba(31, 26, 20, 0.15); --success: #3f6f6b; --orange: #c0743a;}
        
        body { margin: 0; padding: 0; min-height: 100vh; background: var(--sand); font-family: -apple-system, BlinkMacSystemFont, sans-serif; position: relative; overflow-x: hidden; color: var(--coal); display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding-top: 15vh; box-sizing: border-box;}
        
        body::before { content: ""; position: fixed; inset: 0; background: radial-gradient(circle at 12% 10%, #f9efe0 0%, transparent 55%), radial-gradient(circle at 80% 18%, #f4d9b0 0%, transparent 60%), radial-gradient(circle at 70% 82%, #e9efe9 0%, transparent 55%), linear-gradient(160deg, #f6efe2 10%, #efe1cb 45%, #f4ecdf 100%); z-index: -2; }
        body::after { content: ""; position: fixed; inset: 0; background-image: repeating-linear-gradient(100deg, rgba(31, 26, 20, 0.04), rgba(31, 26, 20, 0.04) 1px, transparent 1px, transparent 12px), repeating-linear-gradient(10deg, rgba(31, 26, 20, 0.03), rgba(31, 26, 20, 0.03) 1px, transparent 1px, transparent 10px); opacity: 0.55; z-index: -1; pointer-events: none; }
        
        .center-wrapper { display: flex; flex-direction: column; align-items: center; gap: 20px; z-index: 10; width: 100%; max-width: 650px; padding: 0 20px; box-sizing: border-box;}

        .user-widget { display: flex; justify-content: center; align-items: center; gap: 8px; flex-wrap: wrap; z-index: 20; width: 100%;}
        .btn-glass { background: rgba(255,255,255,0.6); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); padding: 8px 16px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.5); color: var(--coal); font-weight: bold; cursor: pointer; text-decoration: none; font-size: 13px; transition: 0.2s; box-shadow: 0 4px 10px rgba(0,0,0,0.02); display: flex; align-items: center;}
        .btn-glass:hover { background: white; transform: translateY(-2px); box-shadow: 0 6px 15px rgba(0,0,0,0.05); }
        .btn-primary { background: var(--coal); color: var(--sand); border: none; }
        .btn-primary:hover { background: var(--accent); color: white; }
        .user-greeting { font-size: 13px; font-weight: bold; color: var(--coal); margin-right: 5px; background: rgba(255,255,255,0.4); padding: 8px 12px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.3); backdrop-filter: blur(10px);}

        .clock-widget { text-align: center; font-variant-numeric: tabular-nums; width: 100%; box-sizing: border-box; margin-bottom: 5px;}
        .clock-time { font-size: 3rem; font-weight: 800; letter-spacing: 1px; line-height: 1; margin-bottom: 5px; color: var(--coal);}
        .clock-date { font-size: 1rem; font-weight: 600; opacity: 0.8; letter-spacing: 0.5px; }

        .search-container { width: 100%; position: relative; display: flex; box-shadow: 0 10px 35px rgba(0,0,0,0.06); border-radius: 30px; overflow: hidden; background: rgba(255,255,255,0.85); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.5); transition: all 0.3s;}
        .search-container:focus-within { box-shadow: 0 15px 40px rgba(0,0,0,0.1); transform: translateY(-2px); border-color: rgba(192, 116, 58, 0.4);}
        .search-container input { flex: 1; border: none; padding: 18px 20px; font-size: 1.05rem; outline: none; background: transparent; color: var(--coal); font-weight: 500; min-width: 0;}
        .search-container button { background: var(--coal); color: white; border: none; padding: 0 20px; font-weight: bold; font-size: 1.05rem; cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center; flex-shrink: 0; white-space: nowrap;}
        .search-container button:hover { background: var(--accent); }

        .weather-box { position: absolute; top: 15px; left: 15px; background: rgba(255, 255, 255, 0.4); backdrop-filter: blur(10px); padding: 8px 12px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.4); display: flex; align-items: center; gap: 8px; z-index: 20;}
        .weather-city { font-weight: bold; color: var(--orange); font-size: 12px;}
        .weather-detail { font-size: 11px; color: #666; margin-top: 1px;}
        .weather-temp { font-size: 16px; font-weight: bold; color: var(--coal); }

        .music-box { position: absolute; top: 15px; right: 15px; background: rgba(255, 255, 255, 0.4); backdrop-filter: blur(10px); padding: 8px 12px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.4); display: flex; align-items: center; gap: 8px; z-index: 20; cursor: pointer; user-select: none;}
        .music-status { font-weight: bold; color: #777; font-size: 12px;}
        .music-bars { display: flex; align-items: flex-end; gap: 2.5px; height: 11px;}
        .music-bars .bar { width: 2.5px; height: 3px; background-color: var(--coal); border-radius: 1px;}
        .music-bars.playing .bar { animation: bounceBars 1.8s ease-in-out infinite alternate; }
        .music-bars.playing .bar:nth-child(1) { animation-duration: 1.2s; }
        .music-bars.playing .bar:nth-child(2) { animation-duration: 1.6s; }
        .music-bars.playing .bar:nth-child(3) { animation-duration: 1.4s; }
        .music-bars.playing .bar:nth-child(4) { animation-duration: 1.7s; }
        @keyframes bounceBars { 0% { height: 3px; } 100% { height: 11px; } }

        .game-btn { position: absolute; bottom: 20px; left: 20px; background: rgba(255, 255, 255, 0.4); backdrop-filter: blur(10px); padding: 8px 12px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.4); display: flex; align-items: center; gap: 8px; z-index: 20; text-decoration: none; color: var(--orange); font-weight: bold; font-size: 14px; transition: 0.2s; }
        .game-btn:active { transform: scale(0.95); }

        #wallpaper-widget { width: 100%; background: rgba(255,255,255,0.75); padding: 10px; border-radius: 16px; box-shadow: 0 6px 20px rgba(0,0,0,0.03); backdrop-filter: blur(6px); text-align: center; font-size: 12px; border: 1px solid #eee; transition: all 0.3s; box-sizing: border-box; margin-bottom: 80px; max-width: 360px; margin-top: 30px;}
        #today-img { width: 100%; height: 120px; object-fit: cover; border-radius: 10px; cursor: pointer; box-shadow: 0 3px 8px rgba(0,0,0,0.04); background: #eee;}

        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(5px); z-index: 9999; display: none; justify-content: center; align-items: center; padding: 20px;}
        .auth-card { background: var(--sand); padding: 30px 20px; border-radius: 18px; box-shadow: 0 15px 40px rgba(0,0,0,0.15); border: 1px solid var(--soft-line); width: 100%; max-width: 320px; box-sizing: border-box; position: relative;}
        .close-modal { position: absolute; top: 15px; right: 15px; background: transparent; border: none; font-size: 20px; cursor: pointer; color: #888;}
        .tabs { display: flex; margin-bottom: 20px; border-bottom: 2px solid var(--soft-line); }
        .tab { flex: 1; text-align: center; padding: 8px; cursor: pointer; font-weight: bold; color: #888; font-size: 0.95rem;}
        .tab.active { color: var(--coal); border-bottom: 2px solid var(--coal); margin-bottom: -2px; }
        .input-group { margin-bottom: 14px; }
        .input-group label { display: block; font-size: 0.85rem; margin-bottom: 5px; color: var(--coal); font-weight: bold;}
        .input-group input { width: 100%; padding: 12px; border: 1px solid var(--soft-line); border-radius: 6px; box-sizing: border-box; background: rgba(255,255,255,0.8); outline: none; font-size: 1rem;}
        .btn { width: 100%; padding: 13px; border: none; border-radius: 6px; background: var(--coal); color: white; font-size: 0.95rem; font-weight: bold; cursor: pointer; transition: 0.3s; margin-top: 8px; }
        .btn:hover { opacity: 0.9;}
        #msg { margin-top: 15px; font-size: 0.8rem; text-align: center; color: var(--orange); font-weight: bold; min-height: 18px; line-height: 1.4;}

        @media (min-width: 768px) {
            body { padding-top: 20vh; }
            .clock-time { font-size: 4rem;}
            .search-container input { padding: 22px 25px; font-size: 1.15rem;}
            .search-container button { padding: 0 35px; font-size: 1.1rem;}
            
            .music-box { top: 25px; right: 25px; }
            .weather-box { top: 25px; left: 25px; }
            .game-btn { bottom: 25px; left: 25px; }
            #wallpaper-widget { position: fixed; bottom: 25px; right: 25px; width: 220px; margin: 0; }
        }
    </style>
</head>
<body>

    <audio id="bgm-player" loop preload="auto" src="bgm.mp3"></audio>

    <div class="weather-box" id="weatherBox">
        <div style="font-size: 22px;" id="weatherIcon">🌍</div>
        <div style="display: flex; flex-direction: column;">
            <div id="weatherLocation" class="weather-city">定位中..</div>
            <div id="weatherDetail" class="weather-detail">正在同步</div>
        </div>
        <div id="weatherTemp" class="weather-temp" style="margin-left: 5px;">--°C</div>
    </div>

    <div class="music-box" id="musicBox" onclick="toggleMusic(event)">
        <div class="music-status" id="musicStatus">点击播放</div>
        <div class="music-bars" id="musicBars">
            <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
        </div>
    </div>

    <div class="modal-overlay" id="loginModal" onclick="closeLoginModal(event)">
        <div class="auth-card" onclick="event.stopPropagation()">
            <button class="close-modal" onclick="closeLoginModal(true)">&times;</button>
            <div class="tabs">
                <div class="tab active" id="tabLogin" onclick="switchTab('login')">登录</div>
                <div class="tab" id="tabRegister" onclick="switchTab('register')">注册账号</div>
            </div>

            <div id="loginForm">
                <div class="input-group"><label>账号</label><input type="text" id="loginUser" placeholder="输入账号"></div>
                <div class="input-group"><label>密码</label><input type="password" id="loginPwd" placeholder="输入密码"></div>
                <button class="btn" onclick="doLogin()">安全登录</button>
            </div>

            <div id="registerForm" style="display: none;">
                <div class="input-group"><label>设置账号</label><input type="text" id="regUser" placeholder="起个名字"></div>
                <div class="input-group"><label>设置密码</label><input type="password" id="regPwd" placeholder="设置密码"></div>
                <button class="btn" onclick="doRegister()" style="background: #c0743a;">注册网盘权限</button>
            </div>
            <div id="msg"></div>
        </div>
    </div>

    <div class="center-wrapper">
        <div class="user-widget">
            <div id="loggedOutView" style="display: flex;">
                <button class="btn-glass" onclick="openLoginModal()">🛡️ 登录授权</button>
            </div>
            <div id="loggedInView" style="display: none; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: center;">
                <div class="user-greeting">👋 <span id="displayUsername"></span></div>
                <a href="dashboard.html" class="btn-glass btn-primary">💾 我的网盘</a>
                <button class="btn-glass" onclick="doLogout()">退出</button>
            </div>
        </div>

        <div class="clock-widget">
            <div class="clock-time" id="clock-time">00:00:00</div>
            <div class="clock-date" id="clock-date">读取中...</div>
        </div>

        <div class="search-container">
            <input type="text" id="searchInput" placeholder="向 AI 提问，或搜索任何知识..." onkeypress="handleEnter(event)">
            <button onclick="executeSearch()">✨ 搜索</button>
        </div>

        <div id="wallpaper-widget">
            <p style="margin: 0 0 6px 0; color: #666; font-weight: bold;">今日必应壁纸</p>
            <img id="today-img" src="" onclick="window.open(this.src)" alt="加载中...">
            <a href="wallpapers.html" style="display:block; margin-top:8px; color:#007bff; text-decoration:none; font-weight:bold;">查看更多壁纸 &raquo;</a>
        </div>
    </div>

    <a href="games.html" class="game-btn">
        <span style="font-size: 18px;">🎮</span> 游戏大厅
    </a>

    <script>
        function executeSearch() {
            const query = document.getElementById('searchInput').value.trim();
            if (!query) return;
            window.location.href = `search.html?q=${encodeURIComponent(query)}`;
        }

        function handleEnter(e) {
            if (e.key === 'Enter') executeSearch();
        }

        function updateLoginState() {
            const user = localStorage.getItem('currentUser');
            if (user) {
                document.getElementById('loggedOutView').style.display = 'none';
                document.getElementById('loggedInView').style.display = 'flex';
                document.getElementById('displayUsername').innerText = user;
            } else {
                document.getElementById('loggedOutView').style.display = 'flex';
                document.getElementById('loggedInView').style.display = 'none';
            }
        }

        function openLoginModal() { document.getElementById('loginModal').style.display = 'flex'; }
        function closeLoginModal(force) { if (force === true || !force.target) { document.getElementById('loginModal').style.display = 'none'; } else if (force.target.id === 'loginModal') { document.getElementById('loginModal').style.display = 'none'; } }

        function doLogout() {
            localStorage.removeItem('currentUser');
            updateLoginState();
        }

        async function doLogin() {
            const u = document.getElementById('loginUser').value;
            const p = document.getElementById('loginPwd').value;
            const msg = document.getElementById('msg');
            msg.style.color = 'var(--orange)';
            if(!u || !p) return msg.innerText = '账号和密码不能为空！';
            
            msg.innerText = '验证中...';
            const res = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username: u, password: p }) });
            const data = await res.json();
            if (res.ok) {
                msg.style.color = 'var(--success)'; msg.innerText = '✅ 登录成功！';
                localStorage.setItem('currentUser', u);
                setTimeout(() => {
                    closeLoginModal(true);
                    updateLoginState(); 
                }, 800);
            } else { msg.innerText = data.error || '登录失败'; }
        }

        async function doRegister() {
            const u = document.getElementById('regUser').value;
            const p = document.getElementById('regPwd').value;
            const msg = document.getElementById('msg');
            if(!u || !p) return msg.innerText = '不能为空！';
            const res = await fetch('/api/register', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username:u, password:p }) });
            if (res.ok) {
                msg.style.color = 'var(--success)'; msg.innerText = '🎉 注册成功！即将跳转登录。';
                setTimeout(() => switchTab('login'), 1500);
            } else { msg.innerText = '注册失败'; }
        }

        function switchTab(t) {
            document.getElementById('msg').innerText = '';
            if(t === 'login') {
                document.getElementById('tabLogin').classList.add('active'); document.getElementById('tabRegister').classList.remove('active');
                document.getElementById('loginForm').style.display = 'block'; document.getElementById('registerForm').style.display = 'none';
            } else {
                document.getElementById('tabRegister').classList.add('active'); document.getElementById('tabLogin').classList.remove('active');
                document.getElementById('registerForm').style.display = 'block'; document.getElementById('loginForm').style.display = 'none';
            }
        }

        const audio = document.getElementById('bgm-player');
        function toggleMusic(e) {
            if (e) e.stopPropagation(); 
            if (audio.paused) {
                audio.play().then(() => {
                    document.getElementById('musicBars').classList.add('playing'); 
                    document.getElementById('musicStatus').innerText = '正在播放';
                }).catch(() => { document.getElementById('musicStatus').innerText = '无音乐文件'; });
            } else {
                audio.pause();
                document.getElementById('musicBars').classList.remove('playing'); 
                document.getElementById('musicStatus').innerText = '已暂停';
            }
        }

        function startClock() {
            const timeEl = document.getElementById('clock-time'), dateEl = document.getElementById('clock-date');
            const weekdays = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
            setInterval(() => {
                const now = new Date();
                timeEl.innerText = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}`;
                dateEl.innerText = `${now.getFullYear()}年${String(now.getMonth() + 1).padStart(2,'0')}月${String(now.getDate()).padStart(2,'0')}日 ${weekdays[now.getDay()]}`;
            }, 1000);
        }

        window.onload = function() {
            updateLoginState(); 
            startClock();
            
            // 🌟 核心升级：100%成功的 IP 自动化静默定位
            fetch('https://get.geojs.io/v1/ip/geo.json')
            .then(res => res.json())
            .then(geo => {
                const lat = geo.latitude;
                const lon = geo.longitude;
                const cityEng = geo.city || 'Unknown';
                
                // 常见城市英文转中文映射表
                const cityMap = {
                    'Beijing': '北京市', 'Shanghai': '上海市', 'Guangzhou': '广州市', 'Shenzhen': '深圳市',
                    'Hangzhou': '杭州市', 'Chengdu': '成都市', 'Wuhan': '武汉市', 'Nanjing': '南京市',
                    'Tianjin': '天津市', 'Chongqing': '重庆市', 'Xi\'an': '西安市', 'Suzhou': '苏州市',
                    'Changsha': '长沙市', 'Shenyang': '沈阳市', 'Qingdao': '青岛市', 'Dalian': '大连市',
                    'Zhengzhou': '郑州市', 'Xiamen': '厦门市', 'Fuzhou': '福州市', 'Harbin': '哈尔滨市',
                    'Hefei': '合肥市', 'Shijiazhuang': '石家庄市', 'Kunming': '昆明市', 'Jinan': '济南市'
                };
                
                // 写入并渲染城市名
                document.getElementById('weatherLocation').innerText = cityMap[cityEng] || cityEng;

                // 依靠拿到的经纬度请求天气
                return fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`);
            })
            .then(r => r.json())
            .then(d => {
                document.getElementById('weatherTemp').innerText = Math.round(d.current_weather.temperature) + '°C';
                document.getElementById('weatherDetail').innerText = d.current_weather.weathercode < 3 ? '晴好' : '多云/雨';
            })
            .catch(() => {
                document.getElementById('weatherLocation').innerText = '地球某处';
                document.getElementById('weatherTemp').innerText = '--°C';
                document.getElementById('weatherDetail').innerText = '同步失败';
            });

            fetch('/api/get-public-wallpapers?type=latest').then(r=>r.json()).then(d=>{
                document.getElementById('today-img').src = (d && d.img_url) ? d.img_url : "https://bing.biturl.top/?resolution=1920&format=image&index=0&mkt=zh-CN";
            }).catch(()=>{ document.getElementById('today-img').src = "https://bing.biturl.top/?resolution=1920&format=image&index=0&mkt=zh-CN"; });
        };
    </script>
</body>
</html>
