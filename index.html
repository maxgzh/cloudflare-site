<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>混合动力拖拉机田间作业载荷数据平台</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./css/login.css">
</head>
<body>
  <header class="login-header">
    <div class="login-header-inner">
      <a class="login-brand" href="./index.html" aria-label="返回登录界面">
        <img src="./images/cau-engineering-logo.jpg" alt="中国农业大学工学院院徽">
        <span>
          <strong>混合动力拖拉机田间作业载荷数据平台</strong>
          <small>田间试验数据管理与载荷分析</small>
        </span>
      </a>
      <a class="demo-entry" href="./platforms.html">进入演示首页</a>
    </div>
  </header>

  <section class="login-hero" aria-label="农业机械田间作业场景">
    <div class="login-hero-shade"></div>
  </section>

  <main class="login-main">
    <section class="platform-intro" aria-labelledby="platformTitle">
      <span class="intro-kicker">AGRICULTURAL MACHINERY TEST PLATFORM</span>
      <h1 id="platformTitle">混合动力拖拉机田间作业载荷数据平台</h1>
      <p>本平台面向农机田间试验数据管理与分析，集成试验总览、在线监测、历史轨迹、作业管理、载荷谱编制与综合展示等功能，为农机装备试验验证与数据分析提供支撑。</p>
      <div class="intro-tags" aria-label="平台能力">
        <span>田间试验数据</span>
        <span>作业过程监测</span>
        <span>载荷谱分析</span>
      </div>
    </section>

    <section class="login-card" aria-labelledby="loginTitle">
      <div class="login-card-head">
        <span>用户登录</span>
        <h2 id="loginTitle">平台登录</h2>
        <p>请输入演示账号信息进入系统</p>
      </div>

      <form id="loginForm" class="login-form" novalidate>
        <label for="username">用户名</label>
        <input id="username" name="username" type="text" autocomplete="username" placeholder="请输入用户名" required>

        <label for="password">密码</label>
        <input id="password" name="password" type="password" autocomplete="current-password" placeholder="请输入密码" required>

        <div class="login-options">
          <label class="remember-option" for="rememberPassword">
            <input id="rememberPassword" type="checkbox">
            <span>记住密码</span>
          </label>
          <button id="forgotPassword" class="forgot-button" type="button">忘记密码？</button>
        </div>

        <p id="loginError" class="login-error" role="alert" aria-live="polite"></p>
        <button class="login-submit" type="submit">登录</button>
      </form>

      <p class="demo-account">演示账号：admin　密码：admin123</p>
    </section>
  </main>

  <footer class="login-footer">中国农业大学工学院 · 农业装备田间试验数据平台</footer>
  <script src="./js/login.js"></script>
</body>
</html>
