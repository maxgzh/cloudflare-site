<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>惊喜网站</title>
    <style>
      :root {
        --sand: #f4ecdf;
        --coal: #2f251c;
      }
      body {
        margin: 0;
        padding: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: var(--sand);
        font-family: sans-serif;
      }
      /* 背景装饰层 */
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        background: radial-gradient(circle at 12% 10%, #f9efe0 0%, transparent 55%),
                    radial-gradient(circle at 80% 18%, #f4d9b0 0%, transparent 60%),
                    radial-gradient(circle at 70% 82%, #e9efe9 0%, transparent 55%),
                    linear-gradient(160deg, #f6efe2 10%, #efe1cb 45%, #f4ecdf 100%);
        z-index: -2;
      }
      body::after {
        content: "";
        position: fixed;
        inset: 0;
        background-image: repeating-linear-gradient(100deg, rgba(31, 26, 20, 0.04), rgba(31, 26, 20, 0.04) 1px, transparent 1px, transparent 12px),
                          repeating-linear-gradient(10deg, rgba(31, 26, 20, 0.03), rgba(31, 26, 20, 0.03) 1px, transparent 1px, transparent 10px);
        opacity: 0.55;
        z-index: -1;
        pointer-events: none;
      }
      /* 按钮样式 */
      .btn {
        padding: 16px 32px;
        border-radius: 999px;
        text-decoration: none;
        font-weight: 600;
        font-size: 1.1rem;
        background: var(--coal);
        color: #fff;
        box-shadow: 0 10px 25px rgba(31, 26, 20, 0.2);
        transition: transform 0.3s ease, box-shadow 0.3s ease;
      }
      .btn:hover {
        transform: translateY(-3px);
        box-shadow: 0 15px 30px rgba(31, 26, 20, 0.3);
      }
    </style>
  </head>
  <body>
    <a href="photo.jpg" class="btn" target="_blank">
      点击有惊喜
    </a>
  </body>
</html>
