<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>能量中转站 - 游戏大厅</title>
    <style>
        :root { --sand: #f4ecdf; --coal: #2f251c; --soft-line: rgba(31, 26, 20, 0.15); --accent: #c0743a; }
        body { margin: 0; padding: 20px; min-height: 100vh; background: var(--sand); color: var(--coal); font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
        body::before { content: ""; position: fixed; inset: 0; background: radial-gradient(circle at 12% 10%, #f9efe0 0%, transparent 55%), radial-gradient(circle at 80% 18%, #f4d9b0 0%, transparent 60%), linear-gradient(160deg, #f6efe2 10%, #efe1cb 45%, #f4ecdf 100%); z-index: -2; }
        
        .header { max-width: 1000px; margin: 0 auto 30px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--soft-line); padding-bottom: 15px;}
        .header h1 { margin: 0; font-size: 1.8rem; }
        .back-btn { text-decoration: none; color: var(--coal); font-weight: bold; padding: 8px 16px; background: rgba(255,255,255,0.5); border-radius: 8px; border: 1px solid var(--soft-line); }

        /* 游戏列表网格：自适应手机和电脑 */
        .game-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; max-width: 1000px; margin: 0 auto; }
        
        .game-card { background: rgba(255,255,255,0.7); border-radius: 16px; padding: 20px; border: 1px solid var(--soft-line); box-shadow: 0 8px 20px rgba(0,0,0,0.03); transition: transform 0.2s; display: flex; flex-direction: column; justify-content: space-between;}
        .game-card:hover { transform: translateY(-5px); }
        .game-icon { font-size: 40px; margin-bottom: 10px; }
        .game-title { font-size: 1.2rem; font-weight: bold; margin: 0 0 10px 0; }
        .game-desc { font-size: 0.9rem; color: #666; margin-bottom: 20px; line-height: 1.5; flex-grow: 1;}
        
        .play-btn { display: block; text-align: center; background: var(--coal); color: white; text-decoration: none; padding: 12px; border-radius: 8px; font-weight: bold; transition: 0.3s;}
        .play-btn:hover { background: var(--accent); }
        
        .disabled-btn { display: block; text-align: center; background: #ccc; color: #666; text-decoration: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: not-allowed;}
    </style>
</head>
<body>

    <div class="header">
        <h1>🎮 游戏大厅</h1>
        <a href="index.html" class="back-btn">&laquo; 返回主页</a>
    </div>

    <div class="game-grid">
        <div class="game-card">
            <div>
                <div class="game-icon">🏪</div>
                <h3 class="game-title">赛博小店 (AI引擎)</h3>
                <p class="game-desc">在废土黑市经营你的杂货铺。由 DeepSeek 大模型实时演算因果律的硬核文字模拟器。</p>
            </div>
            <a href="game.html" class="play-btn">进入系统 &raquo;</a>
        </div>

        <div class="game-card">
            <div>
                <div class="game-icon">🌲</div>
                <h3 class="game-title">迷雾森林 (多人PVE)</h3>
                <p class="game-desc">组队穿越AI生成的迷雾森林，破解机关、躲避危险，合作逃出险境。支持2-6人联机。</p>
            </div>
            <a href="forest.html" class="play-btn">进入森林 &raquo;</a>
        </div>

       <div class="game-card">
            <div>
                <div class="game-icon">🎨</div>
                <h3 class="game-title">你画我猜 (触屏版)</h3>
                <p class="game-desc">专为手机优化，零延迟实时画板。开着语音，一个人在手机上画，另一个人猜，尽情施展你的抽象派画技！</p>
            </div>
            <a href="https://game3.maxgzh.xyz" target="_blank" class="play-btn">进入画室 &raquo;</a>
        </div>

        
        <div class="game-card">
            <div>
                <div class="game-icon">🛸</div>
                <h3 class="game-title">星际航线</h3>
                <p class="game-desc">深空探测雷达未发现可用信号，工程师正在疯狂敲击键盘。</p>
            </div>
            <div class="disabled-btn">敬请期待</div>
        </div>
    </div>

</body>
</html>
