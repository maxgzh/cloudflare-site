<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>我的私有云盘</title>
    <style>
        body { font-family: sans-serif; background: #f4ecdf; margin: 0; padding: 20px; color: #2f251c; }
        .container { max-width: 600px; margin: 40px auto; background: rgba(255,255,255,0.9); padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        h1 { margin-top: 0; color: #c0743a; }
        .upload-section { background: #efe1cb; padding: 20px; border-radius: 12px; margin: 20px 0; display: flex; gap: 10px; align-items: center; flex-wrap: wrap;}
        .btn { background: #2f251c; color: white; border: none; padding: 8px 15px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .file-item { display: flex; justify-content: space-between; align-items: center; padding: 12px; border-bottom: 1px solid rgba(0,0,0,0.05); }
        .file-link { color: #c0743a; text-decoration: none; font-weight: bold; margin-right: 10px; cursor: pointer;}
        .path-nav { font-weight: bold; margin-bottom: 15px; padding: 10px; background: #e9efe9; border-radius: 8px;}
    </style>
</head>
<body>

<div class="container">
    <a href="#" style="float: right; color: #888; text-decoration: none;" onclick="logout()">退出登录</a>
    <h1 id="welcome-title">正在加载...</h1>
    
    <div class="path-nav">
        当前路径: <span id="currentPathDisplay">/</span>
        <button onclick="goUp()" class="btn" style="float: right; padding: 4px 10px; background: #888;">返回上一级</button>
    </div>

    <div class="upload-section">
        <input type="file" id="fileInput" style="max-width: 180px;">
        <button class="btn" onclick="uploadFile()">开始上传</button>
        <button class="btn" onclick="createNewFolder()" style="background: #3f6f6b;">+ 新建文件夹</button>
    </div>
    <p id="uploadStatus" style="font-size: 12px; color: #666; font-weight: bold;"></p>
    
    <div id="progressContainer" style="display: none; background: #e9efe9; padding: 15px; border-radius: 10px; margin: 10px 0;">
        <div style="font-size: 12px; margin-bottom: 5px; font-weight: bold; color: #3f6f6b;">正在全速上传到云端... <span id="progressPercent">0%</span></div>
        <div style="width: 100%; background: #ccc; height: 12px; border-radius: 6px; overflow: hidden;">
            <div id="progressBar" style="width: 0%; background: #3f6f6b; height: 100%; transition: width 0.1s linear;"></div>
        </div>
    </div>

    <h3>我的私有文件网盘</h3>
    <div id="fileList">正在加载列表...</div>
</div>

<script>
    const currentUser = localStorage.getItem('currentUser');
    let currentPath = '/'; 

    if (!currentUser) {
        window.location.href = 'index.html';
    } else {
        document.getElementById('welcome-title').innerText = `欢迎您，${currentUser}`;
        loadMyFiles(); 
    }

    // 1. 获取列表
    async function loadMyFiles() {
        document.getElementById('currentPathDisplay').innerText = currentPath;
        const res = await fetch(`/api/get-wallpapers?username=${encodeURIComponent(currentUser)}&folder_path=${encodeURIComponent(currentPath)}`);
        const files = await res.json();
        const listDiv = document.getElementById('fileList');
        
        if (!files || files.length === 0) {
            listDiv.innerHTML = '<p style="color:#888;">这里空空如也，传个文件或建个文件夹吧！</p>';
            return;
        }

        listDiv.innerHTML = '';
        files.forEach(file => {
            if (file.file_type === 'folder') {
                listDiv.innerHTML += `
                    <div class="file-item" style="background: rgba(63, 111, 107, 0.08); border-radius:6px; margin-bottom:5px;">
                        <div style="cursor:pointer;" onclick="enterFolder('${file.file_name}')">
                            📁 <strong>${file.file_name}</strong>
                        </div>
                        <button onclick="deleteFile(${file.id})" class="btn" style="background:#c0743a; padding:4px 8px;">删除</button>
                    </div>
                `;
            } else {
                listDiv.innerHTML += `
                    <div class="file-item">
                        <div>
                            📄 <strong>${file.file_name}</strong>
                        </div>
                        <div>
                            <a class="file-link" href="${file.download_url}" target="_blank" download="${file.file_name}">下载</a>
                            <a class="file-link" style="color:#3f6f6b;" onclick="moveFile(${file.id}, '${file.file_name}')">移动</a>
                            <button onclick="deleteFile(${file.id})" class="btn" style="background:#c0743a; padding:4px 8px;">删除</button>
                        </div>
                    </div>
                `;
            }
        });
    }

    // 2. 文件夹进入与回退
    function enterFolder(folderName) {
        currentPath = currentPath === '/' ? `/${folderName}` : `${currentPath}/${folderName}`;
        loadMyFiles();
    }

    function goUp() {
        if (currentPath === '/') return;
        const parts = currentPath.split('/');
        parts.pop();
        currentPath = parts.join('/') || '/';
        loadMyFiles();
    }

    // 3. 新建文件夹
    async function createNewFolder() {
        const folderName = prompt("请输入文件夹名称：");
        if (!folderName) return;

        await fetch('/api/new-folder', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: currentUser, folder_name: folderName, folder_path: currentPath })
        });
        loadMyFiles();
    }

    // 4. 移动文件
    async function moveFile(fileId, fileName) {
        const targetPath = prompt(`你要把 [${fileName}] 移动到哪个路径？\n根目录填 / \n特定文件夹如：/照片`, '/');
        if (!targetPath) return;

        await fetch('/api/move-file', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id: fileId, username: currentUser, new_folder_path: targetPath })
        });
        loadMyFiles();
    }

    // 5. 升级版：支持真实进度条的大文件上传逻辑
    function uploadFile() {
        const fileInput = document.getElementById('fileInput');
        const status = document.getElementById('uploadStatus');
        const progressContainer = document.getElementById('progressContainer');
        const progressBar = document.getElementById('progressBar');
        const progressPercent = document.getElementById('progressPercent');

        if (fileInput.files.length === 0) return alert('请先选择文件！');
        
        const file = fileInput.files[0];
        // 前端硬限制：单文件最大放宽到 50MB
        if (file.size > 50 * 1024 * 1024) return alert('为了安全，单文件不要超过 50MB！');

        status.style.color = "#2f251c";
        status.innerText = "正在读取本地文件...";
        
        const reader = new FileReader();
        reader.onload = function() {
            status.innerText = "正在连接服务器并发射数据...";
            
            // 显示进度条，并把进度清零
            progressContainer.style.display = "block";
            progressBar.style.style.width = "0%";
            progressPercent.innerText = "0%";

            // 🌟 核心：使用 XMLHttpRequest 开启高精度进度监视
            const xhr = new XMLHttpRequest();
            xhr.open('POST', '/api/upload-wallpaper', true);
            xhr.setRequestHeader('Content-Type', 'application/json');

            // 🛰️ 进度条雷达实时监听
            xhr.upload.onprogress = function(e) {
                if (e.lengthComputable) {
                    const percent = Math.round((e.loaded / e.total) * 100);
                    progressBar.style.width = percent + "%";
                    progressPercent.innerText = percent + "%";
                }
            };

            // 🏁 上传结束后的响应处理
            xhr.onload = function() {
                // 隐藏进度条
                progressContainer.style.display = "none";

                if (xhr.status === 200) {
                    const result = JSON.parse(xhr.responseText);
                    if (result.success) {
                        status.style.color = "green";
                        status.innerText = "🎉 成功存入 R2 存储桶，安全熔断监控中！";
                        fileInput.value = ''; 
                        loadMyFiles(); 
                    } else {
                        status.style.color = "red";
                        status.innerText = result.error;
                    }
                } else {
                    status.style.color = "red";
                    status.innerText = "上传失败，服务器响应状态码: " + xhr.status;
                }
            };

            // 出错处理
            xhr.onerror = function() {
                progressContainer.style.display = "none";
                status.style.color = "red";
                status.innerText = "网络异常，上传中断！";
            };

            // 发射！
            xhr.send(JSON.stringify({
                username: currentUser,
                file_name: file.name,
                file_type: file.type,
                file_data: reader.result,
                folder_path: currentPath
            }));
        };

        reader.readAsDataURL(file); 
    }

    // 6. 删除逻辑
    async function deleteFile(fileId) {
        if (!confirm("⚠️ 确定要永久删除吗？文件和云端实体都将被清理！")) return;
        await fetch('/api/delete-file', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id: fileId, username: currentUser })
        });
        loadMyFiles();
    }

    function logout() { localStorage.removeItem('currentUser'); window.location.href = 'index.html'; }
</script>
</body>
</html>
